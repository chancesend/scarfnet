; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = m5stack-atom-lite

[env:native]
platform = native
test_filter = test_scarfnet
lib_deps =
    ; No runtime deps — tests include the hardware-free headers directly

[env:m5stack-atom-lite]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
lib_deps =
    M5Stack             ; M5Stack BSP — hardware init, built-in LED, button, IMU
;    m5stack/M5Atom
    fastled/FastLED     ; LED strip control and color math (CRGB, palettes, noise, etc.)
    ArduinoJson         ; OTA /info endpoint
    TaskScheduler @ ^4.0.7  ; cooperative task scheduler for periodic jobs (heartbeat, button poll)
    ; Preferences, Wire, SPI, FS, SPIFFS, SD, HTTPClient, WiFi, WifiClientSecure, Update
    ; are all part of the ESP32 Arduino framework and should resolve automatically.
;    JC_Button

;check_tool = clangtidy

; OTA requires two equal-size app partitions; min_spiffs gives the most room.
; The nvs partition holds per-scarf settings (LED type) and must not move —
; tools/pio_guard_nvs.py fails the build if it does, and blocks `-t erase`.
board_build.partitions = min_spiffs.csv
extra_scripts = tools/pio_guard_nvs.py

; change microcontroller
board_build.mcu = esp32

; change MCU frequency
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L      ;80M, 40M
board_build.flash_mode = dio         ;qio, qout, dio, dout

monitor_speed = 115200

build_src_filter = +<src/> +<include/>  -<tools/>

build_flags =
    -DCORE_DEBUG_LEVEL=0             ;0:None, 1:Error, 2:Warn, 3:Info, 4:Debug, 5:Verbose
    -DARDUINO_RUNNING_CORE=1         ;0:Core0, 1:Core1(default)
    -DARDUINO_EVENT_RUNNING_CORE=1   ;0:Core0, 1:Core1(default)
    -D_TASK_STD_FUNCTION             ; enable std::function / lambda callbacks in TaskScheduler
    -D_TASK_INLINE                   ; inline all Task methods to avoid ODR violations across TUs
    -DSCARFNET_EMBEDDED=1            ; enable hardware-dependent code paths

upload_speed = 1500000   

upload_protocol = esptool